<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="h-16 bg-slateNavy-800/80 backdrop-blur border-b border-slate-700/60 flex items-center justify-between px-8 sticky top-0 z-20">
    <div class="flex items-center gap-4">
        <h2 class="text-lg font-semibold text-white capitalize" th:text="${activeTab != null ? activeTab : 'MenuWise'}">Dashboard</h2>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            Spring Boot 3 + Smile ML
        </span>
    </div>

    <!-- Quick Info Actions -->
    <div class="flex items-center gap-4">
        <!-- Weather Indicator Placeholder -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slateNavy-700/50 border border-slate-600/40 text-xs text-slate-300">
            <i data-lucide="cloud-sun" class="w-4 h-4 text-amber-400"></i>
            <span>Weather Adaptive Mode</span>
        </div>

        <button onclick="fetch('/api/v1/analytics/seed-data?days=90', {method: 'POST'}).then(r => r.json()).then(d => alert(d.message))" 
                class="px-3 py-1.5 bg-slate-700/60 hover:bg-slate-700 text-xs text-slate-200 rounded-lg border border-slate-600 transition flex items-center gap-1.5">
            <i data-lucide="database" class="w-3.5 h-3.5 text-cyan-400"></i>
            <span>Seed 90d Data</span>
        </button>
    </div>
</header>
</body>
</html>
