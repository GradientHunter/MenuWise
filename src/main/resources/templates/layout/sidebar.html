<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="w-64 bg-slateNavy-800 border-r border-slate-700/60 fixed top-0 bottom-0 left-0 flex flex-col z-30">
    <!-- Brand Logo & Name -->
    <div class="h-16 flex items-center px-6 border-b border-slate-700/60 gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
            <i data-lucide="utensils-crossed" class="w-5 h-5"></i>
        </div>
        <div>
            <h1 class="text-base font-bold text-white tracking-tight leading-none">MenuWise</h1>
            <span class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Smart Kitchen AI</span>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
        <a th:href="@{/}" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" class="nav-link">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/pos}" th:classappend="${activeTab == 'pos' ? 'active' : ''}" class="nav-link">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span>POS / Active Orders</span>
        </a>
        <a th:href="@{/inventory}" th:classappend="${activeTab == 'inventory' ? 'active' : ''}" class="nav-link">
            <i data-lucide="boxes" class="w-5 h-5"></i>
            <span>Inventory & Alerts</span>
        </a>
        <a th:href="@{/analytics}" th:classappend="${activeTab == 'analytics' ? 'active' : ''}" class="nav-link">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
            <span>Analytics & Margins</span>
        </a>
        <a th:href="@{/simulator}" th:classappend="${activeTab == 'simulator' ? 'active' : ''}" class="nav-link">
            <i data-lucide="sliders" class="w-5 h-5"></i>
            <span>What-If Simulator</span>
        </a>
    </nav>

    <!-- Quick Status Badge at Bottom -->
    <div class="p-4 border-t border-slate-700/60 bg-slateNavy-900/40">
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
            <div>
                <p class="text-xs font-medium text-slate-300">System Online</p>
                <p class="text-[11px] text-slate-500">Weather & ML Synced</p>
            </div>
        </div>
    </div>
</aside>
</body>
</html>
