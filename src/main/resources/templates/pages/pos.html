<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>POS / Active Orders | MenuWise</title>
</head>
<body>
<div th:fragment="content" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Point of Sale & Active Orders</h2>
            <p class="text-xs text-slate-400">Place orders with real-time Bill of Materials (BOM) stock depletion</p>
        </div>
        <span class="badge-emerald px-3 py-1 rounded-full text-xs font-semibold">Live POS Terminal</span>
    </div>

    <!-- Active Menu Items Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div th:each="item : ${menuItems}" class="card-surface p-4 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-start">
                    <h4 class="text-sm font-semibold text-white" th:text="${item.name}">Item Name</h4>
                    <span class="text-xs font-bold text-emerald-400" th:text="'$' + ${#numbers.formatDecimal(item.sellingPrice, 1, 2)}">$0.00</span>
                </div>
                <p class="text-xs text-slate-400 mt-1" th:text="${item.category != null ? item.category.name : 'General'}">Category</p>
                <div class="mt-2 text-[11px] text-slate-500 flex items-center gap-1">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    <span th:text="${item.prepTimeMin} + ' min prep'">15 min prep</span>
                </div>
            </div>
            <button class="mt-4 w-full py-2 bg-slate-700/60 hover:bg-emerald-600 text-slate-200 hover:text-white rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add to Order
            </button>
        </div>
    </div>
</div>
</body>
</html>
