<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Inventory & Stock Alerts | MenuWise</title>
</head>
<body>
<div th:fragment="content" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Live Inventory & Expiry Alerts</h2>
            <p class="text-xs text-slate-400">Track raw ingredient stocks, unit costs, and upcoming expiration thresholds</p>
        </div>
        <div class="flex gap-2">
            <span class="badge-emerald px-3 py-1 rounded-full text-xs font-semibold" th:text="${ingredients.size()} + ' Ingredients Tracked'">15 Ingredients</span>
        </div>
    </div>

    <!-- Inventory Table -->
    <div class="card-surface overflow-hidden">
        <table class="w-full menuwise-table text-xs">
            <thead>
                <tr>
                    <th>Ingredient</th>
                    <th>Unit</th>
                    <th>Current Stock</th>
                    <th>Minimum Stock</th>
                    <th>Unit Cost</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ing : ${ingredients}">
                    <td class="font-medium text-white" th:text="${ing.name}">Chicken Breast</td>
                    <td th:text="${ing.unit}">kg</td>
                    <td class="font-semibold" th:text="${ing.currentStock}">25.0</td>
                    <td class="text-slate-400" th:text="${ing.minimumStock}">10.0</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(ing.costPerUnit, 1, 2)}">$7.50</td>
                    <td th:text="${ing.expiryDate != null ? ing.expiryDate : 'N/A'}">2026-09-25</td>
                    <td>
                        <span th:if="${ing.currentStock <= ing.minimumStock}" class="badge-danger px-2 py-0.5 rounded text-[10px] font-semibold">Low Stock</span>
                        <span th:unless="${ing.currentStock <= ing.minimumStock}" class="badge-emerald px-2 py-0.5 rounded text-[10px] font-semibold">Healthy</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
