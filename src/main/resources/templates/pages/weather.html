<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::mainContent}, 'Weather Prep', 'weather')}">

<body>
    <div th:fragment="mainContent">

        <div class="sub-header-bar">
            <div class="sub-header-left">
                <h1 class="sub-header-title">Weather Prep</h1>
            </div>
            <div class="sub-header-right">
                <button class="action-pill-btn" onclick="loadWeatherData(true)" id="refreshBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                    </svg>
                    Refresh Live
                </button>
            </div>
        </div>

        <!-- Weather Signal Hero Card -->
        <div id="weatherHeroCard" class="card-panel" style="margin-bottom:1.25rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.25rem;">
                <div>
                    <div
                        style="font-size:0.72rem; font-weight:800; color:#3b82f6; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.25rem;">
                        CURRENT CONDITIONS</div>
                    <div style="display:flex; align-items:baseline; gap:0.85rem;">
                        <div style="font-size:2.4rem; font-weight:800; letter-spacing:-0.04em; color:#0f172a;"
                            id="heroTemp">—°C</div>
                        <div>
                            <div style="font-size:1.15rem; font-weight:800; color:#0f172a;" id="heroCondition">
                                Loading...</div>
                            <div style="font-size:0.8rem; color:#64748b;" id="heroCity">Dhaka, Bangladesh</div>
                        </div>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr 1.4fr; gap:0.65rem; text-align:center;">
                    <div style="background:#f8fafc; border-radius:0.75rem; padding:0.6rem 0.85rem;">
                        <div style="font-size:0.68rem; color:#64748b; font-weight:700; text-transform:uppercase;">
                            Humidity</div>
                        <div style="font-size:1.15rem; font-weight:800; color:#0f172a; margin-top:0.1rem;"
                            id="heroHumidity">—%</div>
                    </div>
                    <div style="background:#f8fafc; border-radius:0.75rem; padding:0.6rem 0.85rem;">
                        <div style="font-size:0.68rem; color:#64748b; font-weight:700; text-transform:uppercase;">Rain
                            Chance</div>
                        <div style="font-size:1.15rem; font-weight:800; color:#0f172a; margin-top:0.1rem;"
                            id="heroRain">—%</div>
                    </div>
                    <div style="background:#f8fafc; border-radius:0.75rem; padding:0.6rem 0.85rem;">
                        <div style="font-size:0.68rem; color:#64748b; font-weight:700; text-transform:uppercase;">Prep
                            Impact</div>
                        <div style="font-size:0.92rem; font-weight:800; color:#15803d; margin-top:0.15rem;"
                            id="heroImpact">—</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recommendations Table Card Panel -->
        <div class="card-panel" style="padding:0; overflow:hidden;">
            <div
                style="padding:1rem 1.35rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.05);">
                <h3 class="card-panel-title" style="margin:0;">Kitchen Prep Recommendations</h3>
                <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">Weather Multipliers</span>
            </div>

            <div id="prepLoadingState" style="padding: 3rem; text-align:center; color:var(--text-muted);">
                <div style="width:24px; height:24px; border:2px solid var(--border-color); border-top-color:var(--primary); border-radius:50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.75rem;"></div>
                Loading weather recommendations...
            </div>

            <div class="table-responsive" id="prepTableWrapper" style="display:none;">
                <table class="calescence-table">
                    <thead>
                        <tr>
                            <th>Menu Item</th>
                            <th>Condition</th>
                            <th>Baseline Prep</th>
                            <th>Multiplier</th>
                            <th>Recommended Qty</th>
                            <th style="text-align:right;">Rationale</th>
                        </tr>
                    </thead>
                    <tbody id="prepTableBody"></tbody>
                </table>
            </div>
        </div>

        <script>
            function mapWmoCode(code) {
                if (code === 0) return 'Clear';
                if (code >= 1 && code <= 3) return 'Clouds';
                if (code === 45 || code === 48) return 'Fog';
                if (code >= 51 && code <= 57) return 'Drizzle';
                if (code >= 61 && code <= 67) return 'Rain';
                if (code >= 71 && code <= 77) return 'Snow';
                if (code >= 80 && code <= 82) return 'Rain';
                if (code >= 85 && code <= 86) return 'Snow';
                if (code >= 95 && code <= 99) return 'Thunderstorm';
                return 'Clouds';
            }

            document.addEventListener('DOMContentLoaded', () => loadWeatherData(false));

            async function loadWeatherData(isRefresh = false) {
                const btn = document.getElementById('refreshBtn');
                if (btn) btn.disabled = true;

                try {
                    let weather = null;
                    let preps = [];

                    try {
                        const endpoint = isRefresh ? '/api/v1/prep/refresh' : '/api/v1/prep/weather';
                        const method = isRefresh ? 'POST' : 'GET';
                        const wRes = await fetch(endpoint, { method });
                        if (wRes.ok) weather = await wRes.json();
                    } catch (e) {
                        console.warn('Backend weather fetch failed:', e);
                    }

                    try {
                        const pRes = await fetch('/api/v1/prep/recommendations');
                        if (pRes.ok) preps = await pRes.json();
                    } catch (e) {
                        console.warn('Backend prep fetch failed:', e);
                    }

                    // If backend returned stale mock data (8°C Rain 82%) or was unavailable
                    if (!weather || (weather.temperatureCelsius === 8 && weather.condition === 'Rain' && weather.humidity === 82)) {
                        try {
                            const omRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current=temperature_2m,relative_humidity_2m,weather_code&daily=precipitation_probability_max&timezone=auto');
                            if (omRes.ok) {
                                const omData = await omRes.json();
                                const current = omData.current || {};
                                const wCode = current.weather_code || 0;
                                const condition = mapWmoCode(wCode);
                                const isInclement = wCode >= 51;
                                const dailyProb = (omData.daily && omData.daily.precipitation_probability_max) || [];
                                const rainProb = dailyProb.length > 0 ? (dailyProb[0] / 100) : (isInclement ? 0.75 : 0.1);

                                weather = {
                                    temperatureCelsius: current.temperature_2m,
                                    condition: condition,
                                    humidity: current.relative_humidity_2m,
                                    rainProbability: rainProb,
                                    isInclementWeather: isInclement,
                                    city: 'Dhaka, Bangladesh'
                                };
                            }
                        } catch (err) {
                            console.error('Direct Open-Meteo fetch failed:', err);
                        }
                    }

                    if (weather) {
                        renderWeatherHero(weather);
                    }
                    if (preps && preps.length > 0) {
                        renderPrepTable(preps);
                    } else {
                        const loadingState = document.getElementById('prepLoadingState');
                        if (loadingState) loadingState.innerHTML = '<span style="display:inline-flex; align-items:center; gap:0.4rem; color:#10b981; font-weight:700;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Menu prep recommendations up to date.</span>';
                    }
                } catch (e) {
                    document.getElementById('heroCondition').textContent = 'Unavailable';
                    document.getElementById('prepLoadingState').innerHTML = '<span style="display:inline-flex; align-items:center; gap:0.4rem; color:#f43f5e; font-weight:700;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Could not load weather data.</span>';
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            function getWeatherSvg(cond) {
                if (cond === 'Clear') {
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#f59e0b;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
                }
                if (cond === 'Rain' || cond === 'Drizzle') {
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#3b82f6;"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`;
                }
                if (cond === 'Thunderstorm') {
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#8b5cf6;"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg>`;
                }
                if (cond === 'Snow') {
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#06b6d4;"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="20" y1="20" x2="4" y2="4"/><line x1="20" y1="4" x2="4" y2="20"/></svg>`;
                }
                return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#64748b;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;
            }

            function renderWeatherHero(weather) {
                const iconSvg = getWeatherSvg(weather.condition);
                document.getElementById('heroTemp').textContent = `${weather.temperatureCelsius != null ? weather.temperatureCelsius.toFixed(1) : '—'}°C`;
                document.getElementById('heroCondition').innerHTML = `<span style="display:inline-flex; align-items:center; gap:0.4rem;">${iconSvg} ${weather.condition || '—'}</span>`;
                document.getElementById('heroCity').textContent = weather.city ? weather.city : 'Dhaka, Bangladesh';
                document.getElementById('heroHumidity').textContent = `${weather.humidity != null ? weather.humidity : '—'}%`;
                document.getElementById('heroRain').textContent = `${weather.rainProbability != null ? Math.round(weather.rainProbability * 100) : '—'}%`;

                const impactText = weather.isInclementWeather
                    ? 'Increase comfort food prep' : (weather.temperatureCelsius && weather.temperatureCelsius > 24)
                        ? 'Increase chilled drinks' : 'Baseline prep optimal';
                document.getElementById('heroImpact').textContent = impactText;
            }

            function renderPrepTable(preps) {
                document.getElementById('prepLoadingState').style.display = 'none';
                document.getElementById('prepTableWrapper').style.display = 'block';

                const tbody = document.getElementById('prepTableBody');
                tbody.innerHTML = preps.map(p => {
                    const mult = p.weatherMultiplier || 1.0;
                    const multLabel = mult > 1.0 ? `+${((mult - 1) * 100).toFixed(0)}%` : mult < 1.0 ? `${((mult - 1) * 100).toFixed(0)}%` : 'Baseline';
                    const multBadge = mult > 1.0 ? 'badge-growth' : mult < 1.0 ? 'badge-danger' : 'badge-lime';

                    return `<tr>
            <td>
                <div style="font-weight:700; color:var(--text-main); font-size:0.88rem;">${p.itemName}</div>
            </td>
            <td style="color:var(--text-muted); font-size:0.82rem;">${p.weatherCondition || '—'}</td>
            <td style="font-size:0.84rem;">${p.baselineQuantity} units</td>
            <td><span class="${multBadge}">${multLabel}</span></td>
            <td style="font-weight:800; color:var(--text-main); font-size:0.92rem;">${p.recommendedQuantity} units</td>
            <td style="font-size:0.8rem; color:var(--text-muted); text-align:right; max-width:280px;">${p.rationale || '—'}</td>
        </tr>`;
                }).join('');
            }
        </script>
    </div>
</body>

</html>
