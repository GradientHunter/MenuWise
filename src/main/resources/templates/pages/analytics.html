<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Margin Analytics', 'analytics')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Margin & Financial Analytics</h1>
        <p class="page-subtitle">Track revenue performance, ingredient cost breakdown, and gross profit margins.</p>
    </div>

    <!-- Analytics Charts Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem;">
        <!-- Chart 1: Revenue Trend -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Revenue Trend (7-Day)</h2>
                <span class="badge-success">Live Trend</span>
            </div>
            <div style="height: 250px;">
                <canvas id="revenueTrendChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: Food Cost % Breakdown -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Food Cost % Breakdown</h2>
                <span class="badge-success">Target: 28%</span>
            </div>
            <div style="height: 250px;">
                <canvas id="foodCostChart"></canvas>
            </div>
        </div>

        <!-- Chart 3: Profit Margin -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Category Profit Margin %</h2>
                <span class="badge-success">Avg Margin: 68%</span>
            </div>
            <div style="height: 250px;">
                <canvas id="profitMarginChart"></canvas>
            </div>
        </div>

        <!-- Chart 4: Top Selling Items -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Top Selling Items Volume</h2>
                <span class="badge-warning">Demand Tracker</span>
            </div>
            <div style="height: 250px;">
                <canvas id="topSellingChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Chart.js Sample Script for Layout Demonstration -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Revenue Trend Chart
            const ctx1 = document.getElementById('revenueTrendChart')?.getContext('2d');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Revenue ($)',
                            data: [3200, 3800, 4100, 3900, 4800, 5600, 4250],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Food Cost Chart
            const ctx2 = document.getElementById('foodCostChart')?.getContext('2d');
            if (ctx2) {
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Proteins', 'Dairy', 'Produce', 'Dry Goods', 'Beverages'],
                        datasets: [{
                            data: [42, 20, 18, 12, 8],
                            backgroundColor: ['#10b981', '#0ea5e9', '#f59e0b', '#8b5cf6', '#ec4899']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Profit Margin Chart
            const ctx3 = document.getElementById('profitMarginChart')?.getContext('2d');
            if (ctx3) {
                new Chart(ctx3, {
                    type: 'bar',
                    data: {
                        labels: ['Mains', 'Appetizers', 'Beverages', 'Desserts'],
                        datasets: [{
                            label: 'Margin %',
                            data: [65, 72, 85, 78],
                            backgroundColor: '#10b981'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Top Selling Chart
            const ctx4 = document.getElementById('topSellingChart')?.getContext('2d');
            if (ctx4) {
                new Chart(ctx4, {
                    type: 'bar',
                    data: {
                        labels: ['Burger', 'Fettuccine', 'Salad', 'Fries', 'Latte'],
                        datasets: [{
                            label: 'Units Sold',
                            data: [142, 98, 76, 115, 88],
                            backgroundColor: '#1e293b'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        });
    </script>
</div>

</body>
</html>
