<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Profit Margin Analytics | MenuWise</title>
</head>
<body>
<div th:fragment="content" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Profitability & Margin Analytics</h2>
            <p class="text-xs text-slate-400">Interactive Chart.js visualizations for top/least profitable items and category sales</p>
        </div>
        <div class="flex gap-2">
            <button class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Last 7 Days</button>
            <button class="px-3 py-1 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs">Last 30 Days</button>
            <button class="px-3 py-1 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs">All Time</button>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card-surface p-5">
            <h3 class="text-sm font-semibold text-white mb-1">Top Margin Dishes</h3>
            <p class="text-[11px] text-slate-400 mb-4">Gross Margin % = ((Selling - Cost) / Selling) * 100</p>
            <div class="h-64 flex items-center justify-center border border-slate-700/40 rounded-lg bg-slateNavy-900/40">
                <canvas id="marginBarChart"></canvas>
            </div>
        </div>

        <div class="card-surface p-5">
            <h3 class="text-sm font-semibold text-white mb-1">Revenue by Category</h3>
            <p class="text-[11px] text-slate-400 mb-4">Category distribution</p>
            <div class="h-64 flex items-center justify-center border border-slate-700/40 rounded-lg bg-slateNavy-900/40">
                <canvas id="categoryDoughnutChart"></canvas>
            </div>
        </div>
    </div>
</div>
</body>
</html>
