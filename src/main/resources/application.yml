spring:
  application:
    name: menuwise
  profiles:
    active: dev

server:
  port: 8080

open-weather:
  api-key: ${OPENWEATHER_API_KEY:mock_key}
  base-url: https://api.openweathermap.org/data/2.5
  city: "New York"
  units: "metric"

menuwise:
  weather:
    api-key: ${OPENWEATHER_API_KEY:demo_key}
    city: "New York"
    base-url: "https://api.openweathermap.org/data/2.5"
    mock-enabled: true
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: "gemini-1.5-flash"

