spring:
  application:
    name: menuwise
  profiles:
    active: dev

server:
  port: ${PORT:8080}

open-weather:
  api-key: ${OPENWEATHER_API_KEY:mock_key}
  base-url: https://api.openweathermap.org/data/2.5
  city: "New York"
  units: "metric"

menuwise:
  weather:
    provider: openmeteo
    city: "Dhaka"
    mock-enabled: false
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: "gemini-flash-lite-latest"

